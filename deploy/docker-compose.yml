x-app: &app
  image: ${APP_IMAGE:-reconflow:local}
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  environment: &app-env
    APP_ENV: production
    APP_DEBUG: "false"
    APP_KEY: ${APP_KEY:?set APP_KEY}
    APP_URL: https://${DOMAIN:-localhost}${PUBLIC_PORT_SUFFIX:-}
    DB_CONNECTION: pgsql
    DB_HOST: db
    DB_PORT: "5432"
    DB_DATABASE: reconflow
    DB_USERNAME: reconflow
    DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    SESSION_DRIVER: database
    SESSION_LIFETIME: ${SESSION_LIFETIME:-30}
    SESSION_ENCRYPT: "true"
    SESSION_SECURE_COOKIE: "true"
    SESSION_SAME_SITE: strict
    CACHE_STORE: database
    QUEUE_CONNECTION: database
    HASH_DRIVER: argon2id
    LOG_CHANNEL: json
    LOG_LEVEL: ${LOG_LEVEL:-info}
    TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
    PII_HASH_SALT: ${PII_HASH_SALT:?set PII_HASH_SALT}
    DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
    RETENTION_TRANSACTIONS_YEARS: ${RETENTION_TRANSACTIONS_YEARS:-7}
    RETENTION_AI_LOGS_MONTHS: ${RETENTION_AI_LOGS_MONTHS:-12}
    RETENTION_AUDIT_YEARS: ${RETENTION_AUDIT_YEARS:-7}
    SOURCE_SYSTEMS_DRIVER: http
    SOURCE_SYSTEMS_URL: http://app:8000
    SOURCE_SYSTEMS_TOKEN: ${SOURCE_SYSTEMS_TOKEN:?set SOURCE_SYSTEMS_TOKEN}
    DEMO_AUTO_SEED: ${DEMO_AUTO_SEED:-true}
    DEMO_DAYS: ${DEMO_DAYS:-14}
    DEMO_SALES_PER_DAY: ${DEMO_SALES_PER_DAY:-3000}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
    AI_ENABLED: ${AI_ENABLED:-true}
    AI_DRIVER: ${AI_DRIVER:-claude}
    AI_EFFORT: ${AI_EFFORT:-medium}
    NOTIFY_MAIL_ENABLED: ${NOTIFY_MAIL_ENABLED:-false}
    NOTIFY_DAILY_SUMMARY_TIME: ${NOTIFY_DAILY_SUMMARY_TIME:-07:00}
    SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
  volumes:
    - audit_archive:/data/audit-archive
    - app_storage:/app/storage/app

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: reconflow
      POSTGRES_USER: reconflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reconflow -d reconflow"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  app:
    <<: *app
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "true"
    networks: [backend, edge]

  worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "--sleep=2", "--tries=3", "--max-time=3600"]
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy
    networks: [backend, edge]

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy
    networks: [backend, edge]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]

volumes:
  pgdata:
  audit_archive:
  app_storage:
  caddy_data:
  caddy_config:

networks:
  backend:
    internal: true
  edge:
