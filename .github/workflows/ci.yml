name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reconflow
          POSTGRES_PASSWORD: reconflow
          POSTGRES_DB: reconflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reconflow -d reconflow_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USERNAME: reconflow
      DB_PASSWORD: reconflow
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, pgsql, bcmath, intl, zip, gd, pcntl
          coverage: pcov
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Composer install
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: npm install
        run: npm ci --no-audit --no-fund

      - name: Prepare environment
        run: cp .env.example .env && php artisan key:generate

      - name: Pint
        run: ./vendor/bin/pint --test

      - name: Larastan
        run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run types

      - name: Vite build
        run: npm run build

      - name: Pest
        run: ./vendor/bin/pest --coverage --min=0 --coverage-clover=coverage.xml

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  image:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ vars.DEPLOY_PATH || '/opt/reconflow' }}
            docker compose -p reconflow -f deploy/docker-compose.yml --env-file deploy/.env pull
            docker compose -p reconflow -f deploy/docker-compose.yml --env-file deploy/.env up -d
